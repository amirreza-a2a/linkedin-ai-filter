<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FeedRule — Dashboard</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 900px; margin: 32px auto; padding: 0 16px; color: #1d1d1d;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }

    .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 130px; border: 1px solid #eee; border-radius: 10px;
      padding: 14px 16px; background: #fafafa;
    }
    .stat-card .num { font-size: 24px; font-weight: 600; }
    .stat-card .label { font-size: 12px; color: #777; margin-top: 2px; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar select, .toolbar input[type="text"] {
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    .toolbar input[type="text"] { flex: 1; min-width: 160px; }
    button.secondary {
      padding: 6px 12px; border: 1px solid #ccc; background: white; border-radius: 14px;
      font-size: 12px; cursor: pointer; color: #555;
    }
    button.secondary:hover { background: #f3f3f3; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #eee; color: #888; font-weight: 500; font-size: 11px; text-transform: uppercase; }
    td { padding: 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    tr:hover { background: #fafafa; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge.hidden { background: #fde8e8; color: #b23; }
    .badge.kept { background: #e8f5e9; color: #2a7a34; }

    .snippet { max-width: 420px; color: #333; }
    .reason { color: #888; font-size: 12px; }
    .ts { color: #999; font-size: 12px; white-space: nowrap; }

    .empty { text-align: center; padding: 40px 0; color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <h1>FeedRule Dashboard</h1>
  <div class="subtitle">What's been hidden and kept from your LinkedIn feed, most recent first.</div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <select id="filterSelect">
      <option value="all">All posts</option>
      <option value="hidden" selected>Hidden only</option>
      <option value="kept">Kept only</option>
    </select>
    <input type="text" id="search" placeholder="Search post text or reason..." />
    <button class="secondary" id="clearBtn">Clear log</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:80px;">Status</th>
        <th>Post excerpt</th>
        <th style="width:180px;">Reason</th>
        <th style="width:110px;">Time</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none;">No entries yet — browse LinkedIn with rules set to populate this.</div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
