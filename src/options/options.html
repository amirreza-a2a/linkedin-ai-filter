<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FeedRule — Settings</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 40px auto; color: #1d1d1d; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 4px; }
    select, input[type="password"], input[type="text"], input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .hint { font-size: 11px; color: #888; margin-top: 3px; }
    button { margin-top: 20px; padding: 9px 16px; background: #0a66c2; color: white; border: none; border-radius: 16px; cursor: pointer; }
    #status { font-size: 12px; color: #2a8a3a; margin-left: 10px; }
    fieldset { border: 1px solid #eee; border-radius: 8px; margin-top: 18px; padding: 12px 16px; }
    legend { font-size: 12px; color: #888; padding: 0 6px; }
  </style>
</head>
<body>
  <h1>FeedRule settings</h1>
  <p class="hint">Your API key is stored locally in your browser only (chrome.storage.local) and is sent directly from your browser to your chosen provider — never to us.</p>

  <label for="provider">AI provider</label>
  <select id="provider">
    <option value="openai">OpenAI</option>
    <option value="gemini">Google Gemini</option>
    <option value="claude">Anthropic Claude</option>
  </select>

  <fieldset>
    <legend>OpenAI</legend>
    <label for="openaiKey">API key</label>
    <input type="password" id="openaiKey" placeholder="sk-..." />
    <label for="openaiModel">Model</label>
    <input type="text" id="openaiModel" placeholder="gpt-4o-mini" />
  </fieldset>

  <fieldset>
    <legend>Google Gemini</legend>
    <label for="geminiKey">API key</label>
    <input type="password" id="geminiKey" placeholder="AI..." />
    <label for="geminiModel">Model</label>
    <input type="text" id="geminiModel" placeholder="gemini-3.5-flash" />
  </fieldset>

  <fieldset>
    <legend>Anthropic Claude</legend>
    <label for="claudeKey">API key</label>
    <input type="password" id="claudeKey" placeholder="sk-ant-..." />
    <label for="claudeModel">Model</label>
    <input type="text" id="claudeModel" placeholder="claude-haiku-4-5-20251001" />
  </fieldset>

  <label for="dailyCap">Daily API call cap (safety guardrail, not tokens)</label>
  <input type="number" id="dailyCap" min="10" step="10" />

  <div>
    <button id="save">Save settings</button>
    <span id="status"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
