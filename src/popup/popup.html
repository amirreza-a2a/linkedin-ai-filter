<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FeedRule</title>
  <style>
    body { width: 330px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 14px; color: #1d1d1d; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #0a66c2; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; font-weight: 500; }
    textarea {
      width: 100%; height: 75px; box-sizing: border-box; padding: 8px;
      font-size: 12px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; margin-bottom: 8px;
    }
    .hint { font-size: 10.5px; color: #777; margin-top: -4px; margin-bottom: 8px; line-height: 1.3; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
    .switch { position: relative; width: 38px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background: #ccc;
      border-radius: 20px; transition: .2s;
    }
    .slider:before {
      content: ""; position: absolute; height: 16px; width: 16px; left: 2px; bottom: 2px;
      background: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #0a66c2; }
    input:checked + .slider:before { transform: translateX(18px); }
    button.primary {
      width: 100%; padding: 8px; background: #0a66c2; color: white; border: none;
      border-radius: 16px; font-size: 13px; cursor: pointer; margin-top: 4px; font-weight: 500;
    }
    button.primary:hover { background: #084e96; }
    .links-section { margin-top: 12px; border-top: 1px solid #eee; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    a.link { font-size: 12px; color: #0a66c2; text-decoration: none; font-weight: 500; }
    a.link:hover { text-decoration: underline; }
    #status { font-size: 11px; color: #2a8a3a; margin-top: 6px; min-height: 14px; text-align: center; }
  </style>
</head>
<body>
  <h1>FeedRule</h1>

  <div class="row">
    <label style="margin:0;">Filter Enabled</label>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <label for="rules">1. Filter Rules (Hide / Keep)</label>
  <textarea id="rules" placeholder="e.g. Hide: recruiter spam, humble-brag posts, crypto/finance ads. Keep anything about AI."></textarea>

  <label for="saveRules">2. Second Brain (Auto-save Topics)</label>
  <textarea id="saveRules" placeholder="e.g. AI, 5G, Embedded Systems, Semiconductors, LDPC"></textarea>
  <p class="hint">Exact match on extracted topic tags (case-insensitive).</p>

  <button class="primary" id="save">Save rules</button>
  <div id="status"></div>

  <div class="links-section">
    <a class="link" href="#" id="openGraph">🕸️ View Knowledge Graph →</a>
    <a class="link" href="#" id="openSaved">🧠 View Second Brain / Saved Posts →</a>
    <a class="link" href="#" id="openDashboard">📊 View filter dashboard →</a>
    <a class="link" href="#" id="openOptions">⚙️ API key & provider settings →</a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
